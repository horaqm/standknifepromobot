<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<meta name="robots" content="noindex, nofollow">
<title>Промокоды</title>
<style>
  :root{
    color-scheme:dark light;
    --bg:#08080a;
    --card:rgba(28,28,32,.62);
    --card-hover:rgba(36,36,42,.72);
    --card-solid:#16161a;
    --text:#f5f5f7;
    --text2:#a1a1a6;
    --text3:#6e6e73;
    --border:rgba(255,255,255,.08);
    --border-strong:rgba(255,255,255,.14);
    --accent:#0a84ff;
    --accent-soft:rgba(10,132,255,.14);
    --accent-soft-border:rgba(10,132,255,.28);
    --field:rgba(255,255,255,.05);
    --green:#30d158;
    --red:#ff453a;
    --overlay:rgba(0,0,0,.55);
    --shadow:0 30px 80px rgba(0,0,0,.5);
    --shadow-card:0 2px 8px rgba(0,0,0,.3),0 20px 50px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme:light){
    :root{
      --bg:#fbfbfd;--card:rgba(255,255,255,.72);--card-hover:rgba(255,255,255,.86);
      --card-solid:#ffffff;--text:#1d1d1f;--text2:#6e6e73;--text3:#a1a1a6;
      --border:rgba(0,0,0,.08);--border-strong:rgba(0,0,0,.14);
      --accent:#0071e3;--accent-soft:rgba(0,113,227,.10);--accent-soft-border:rgba(0,113,227,.24);
      --field:rgba(0,0,0,.04);--overlay:rgba(0,0,0,.35);
      --shadow:0 30px 80px rgba(0,0,0,.18);--shadow-card:0 2px 8px rgba(0,0,0,.05),0 20px 50px rgba(0,0,0,.10);
    }
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100svh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  }
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .bg::before,.bg::after{
    content:"";position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform;
  }
  .bg::before{
    width:60vmax;height:60vmax;top:-25vmax;left:-20vmax;
    background:radial-gradient(circle,#0a84ff 0%,transparent 65%);
    animation:drift1 30s ease-in-out infinite;
  }
  .bg::after{
    width:50vmax;height:50vmax;bottom:-22vmax;right:-15vmax;
    background:radial-gradient(circle,#5e5ce6 0%,transparent 65%);
    animation:drift2 34s ease-in-out infinite;
  }
  @media (prefers-color-scheme:light){.bg::before,.bg::after{opacity:.28}}
  @keyframes drift1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(4vmax,3vmax,0) scale(1.08)}}
  @keyframes drift2{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-4vmax,-3vmax,0) scale(1.12)}}

  .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 22px}

  header.hero{padding:80px 0 40px;text-align:center;animation:enter .8s cubic-bezier(.22,.61,.36,1) both}
  @keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .eyebrow{
    display:inline-block;margin-bottom:20px;padding:6px 14px;border-radius:100px;
    font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-soft-border);
  }
  h1{
    margin:0 0 16px;
    font-size:clamp(40px,8vw,72px);
    font-weight:700;letter-spacing:-.035em;line-height:1.04;
    background:linear-gradient(180deg,var(--text) 30%,var(--text2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{max-width:520px;margin:0 auto;font-size:clamp(16px,2vw,19px);color:var(--text2);line-height:1.5}
  .counter{
    display:inline-flex;align-items:center;gap:8px;margin-top:22px;
    padding:7px 14px;border-radius:100px;font-size:13px;font-weight:500;
    color:var(--text2);background:var(--field);border:1px solid var(--border);
  }
  .counter .dot{
    width:6px;height:6px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 0 rgba(48,209,88,.6);animation:pulse 2.4s ease-out infinite;
  }
  .counter .dot.off{background:var(--text3);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(48,209,88,.6)}70%{box-shadow:0 0 0 8px rgba(48,209,88,0)}100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}}

  .notify-banner{
    display:none;align-items:center;gap:14px;
    margin:24px auto 0;max-width:520px;padding:14px 20px;
    border-radius:100px;
    background:linear-gradient(135deg,rgba(10,132,255,.14),rgba(94,92,230,.14));
    border:1px solid var(--accent-soft-border);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    animation:enter .6s .2s cubic-bezier(.22,.61,.36,1) both;
  }
  .notify-banner.show{display:inline-flex}
  .notify-banner .bell{
    width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-size:17px;flex-shrink:0;
    box-shadow:0 6px 16px rgba(10,132,255,.35);
  }
  .notify-banner .txt{flex:1;text-align:left;font-size:14px;line-height:1.35}
  .notify-banner .txt b{font-weight:600}
  .notify-banner .txt span{color:var(--text2);font-size:13px}
  .notify-banner button{
    padding:9px 16px;border:0;border-radius:100px;cursor:pointer;
    font:inherit;font-size:13px;font-weight:600;color:#fff;
    background:linear-gradient(135deg,#0a84ff,#5e5ce6);
    box-shadow:0 4px 12px rgba(10,132,255,.3);
    transition:transform .15s,filter .2s;white-space:nowrap;
  }
  .notify-banner button:hover{filter:brightness(1.08)}
  .notify-banner button:active{transform:scale(.96)}
  .notify-banner.ok{background:linear-gradient(135deg,rgba(48,209,88,.14),rgba(40,167,69,.14));border-color:rgba(48,209,88,.3)}
  .notify-banner.ok .bell{background:linear-gradient(135deg,#30d158,#28a745);box-shadow:0 6px 16px rgba(48,209,88,.3)}
  .notify-banner.blocked{background:linear-gradient(135deg,rgba(255,159,10,.14),rgba(255,69,58,.14));border-color:rgba(255,159,10,.3)}
  .notify-banner.blocked .bell{background:linear-gradient(135deg,#ff9f0a,#ff453a);box-shadow:0 6px 16px rgba(255,159,10,.3)}

  .section{padding:32px 0 80px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .empty{
    padding:60px 20px;text-align:center;color:var(--text2);
    font-size:15px;border:1.5px dashed var(--border-strong);border-radius:24px;grid-column:1/-1;
  }

  .card{
    position:relative;padding:22px 22px 20px;border-radius:22px;
    background:var(--card);border:1px solid var(--border);
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    box-shadow:var(--shadow-card);
    display:flex;flex-direction:column;gap:14px;
    transition:transform .35s cubic-bezier(.22,.61,.36,1),background .3s,border-color .3s;
    will-change:transform;animation:cardIn .55s cubic-bezier(.22,.61,.36,1) both;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  @media (hover:hover){.card:hover{transform:translateY(-4px);background:var(--card-hover);border-color:var(--border-strong)}}
  .card.fresh{animation:cardIn .55s cubic-bezier(.22,.61,.36,1) both,glow 2.4s ease-out}
  @keyframes glow{0%{box-shadow:0 0 0 0 rgba(10,132,255,.5),var(--shadow-card)}100%{box-shadow:0 0 0 20px rgba(10,132,255,0),var(--shadow-card)}}

  .card-top{display:flex;align-items:center;justify-content:space-between}
  .game-icon{
    width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;
    background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-soft-border);
  }
  .badge{
    font-size:11px;font-weight:600;letter-spacing:.03em;
    padding:4px 10px;border-radius:100px;
    color:var(--text2);background:var(--field);border:1px solid var(--border);
  }
  .badge.new{color:#fff;background:linear-gradient(135deg,#0a84ff,#5e5ce6);border-color:transparent}
  .game-name{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0}
  .meta{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:13px;color:var(--text2)}
  .meta-item{display:inline-flex;align-items:center;gap:5px}
  .meta-item svg{width:13px;height:13px;flex-shrink:0;opacity:.7}
  .channel{color:var(--accent);font-weight:500}

  .reveal{
    margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:13px 22px;border:0;border-radius:100px;cursor:pointer;
    font:inherit;font-size:14.5px;font-weight:600;letter-spacing:-.01em;color:#fff;
    background:linear-gradient(135deg,#0a84ff,#5e5ce6);
    box-shadow:0 6px 18px rgba(10,132,255,.28);
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s,box-shadow .3s,filter .3s;will-change:transform;
  }
  .reveal:hover{filter:brightness(1.08);box-shadow:0 10px 26px rgba(10,132,255,.4)}
  .reveal:active{transform:scale(.97)}

  .overlay{
    position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;
    background:var(--overlay);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .overlay.show{opacity:1;pointer-events:auto}
  .modal{
    position:relative;width:100%;max-width:420px;
    padding:38px 30px 30px;border-radius:28px;
    background:var(--card-solid);border:1px solid var(--border-strong);
    text-align:center;box-shadow:var(--shadow);
    transform:scale(.92) translateY(12px);
    transition:transform .42s cubic-bezier(.22,.61,.36,1);will-change:transform;
  }
  .overlay.show .modal{transform:none}
  .close{
    position:absolute;top:14px;right:14px;width:32px;height:32px;
    border:0;border-radius:50%;background:var(--field);color:var(--text2);font-size:14px;
    cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s;
  }
  .close:hover{background:var(--border-strong);color:var(--text)}

  .m-title{margin:0 0 8px;font-size:22px;font-weight:600;letter-spacing:-.02em}
  .m-sub{margin:0 0 24px;font-size:14px;color:var(--text2);line-height:1.5}

  .slider-wrap{
    margin:0 0 20px;padding:5px;border-radius:18px;
    background:var(--field);border:1px solid var(--border-strong);
    position:relative;user-select:none;-webkit-user-select:none;
  }
  .slider-track{
    position:relative;height:52px;border-radius:14px;
    background:rgba(255,255,255,.04);
    overflow:hidden;cursor:ew-resize;
  }
  .slider-fill{
    position:absolute;left:0;top:0;bottom:0;
    background:linear-gradient(90deg,rgba(10,132,255,.25),rgba(94,92,230,.18));
    border-radius:14px;width:0;transition:background .3s;pointer-events:none;
  }
  .slider-fill.done{background:linear-gradient(90deg,rgba(48,209,88,.3),rgba(40,167,69,.2))}
  .slider-hint{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:500;color:var(--text3);
    pointer-events:none;gap:7px;transition:opacity .3s;
  }
  .slider-hint.hidden{opacity:0}
  .slider-arrows{display:inline-flex;gap:2px;opacity:.5}
  .slider-thumb{
    position:absolute;top:50%;transform:translateY(-50%);left:0;
    width:44px;height:44px;border-radius:12px;
    background:var(--card-solid);border:1px solid var(--border-strong);
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    display:grid;place-items:center;
    cursor:grab;
    transition:box-shadow .2s,left 0s;
    z-index:2;
    touch-action:none;
    user-select:none;-webkit-user-select:none;
  }
  .slider-thumb:active{cursor:grabbing}
  .slider-thumb.released{transition:left .3s cubic-bezier(.22,.61,.36,1),box-shadow .2s}
  .slider-thumb.done{
    background:linear-gradient(135deg,#30d158,#28a745);
    border-color:rgba(48,209,88,.4);
    box-shadow:0 4px 16px rgba(48,209,88,.4);
    cursor:default;
  }
  .slider-thumb svg{width:18px;height:18px;stroke:var(--text2);transition:stroke .2s;pointer-events:none}
  .slider-thumb.done svg{stroke:#fff}

  .err{min-height:18px;margin:6px 2px 12px;font-size:13px;color:var(--red);text-align:center;transition:opacity .2s}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
  .shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:15px 26px;border:0;border-radius:100px;cursor:pointer;
    font:inherit;font-size:15px;font-weight:600;letter-spacing:-.01em;color:#fff;
    background:linear-gradient(135deg,#0a84ff,#5e5ce6);
    box-shadow:0 6px 20px rgba(10,132,255,.3);
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s,box-shadow .3s,filter .3s;will-change:transform;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.45;cursor:default;filter:none;transform:none;box-shadow:none}
  .btn.copied{background:linear-gradient(135deg,#30d158,#28a745);box-shadow:0 6px 20px rgba(48,209,88,.3)}

  .spinner{
    width:34px;height:34px;margin:12px auto 4px;border-radius:50%;
    border:3px solid var(--border-strong);border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .code-canvas-wrap{
    margin:0 0 18px;
    border-radius:18px;overflow:hidden;
    background:var(--field);border:1.5px dashed var(--border-strong);
  }
  #codeCanvas{
    display:block;width:100%;height:auto;
    user-select:none;-webkit-user-select:none;
  }

  .success{width:64px;height:64px;margin:0 auto 20px}
  .success circle,.success path{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .success circle{stroke-dasharray:166;stroke-dashoffset:166;animation:draw .6s cubic-bezier(.65,0,.45,1) forwards}
  .success path{stroke-dasharray:48;stroke-dashoffset:48;animation:draw .4s .38s cubic-bezier(.65,0,.45,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--card-solid);color:var(--text);
    padding:12px 20px;border-radius:100px;font-size:14px;font-weight:500;
    border:1px solid var(--border-strong);box-shadow:var(--shadow);
    z-index:200;opacity:0;
    transition:transform .4s cubic-bezier(.22,.61,.36,1),opacity .3s;
    pointer-events:none;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  footer{padding:20px 0 50px;text-align:center;font-size:13px;color:var(--text3)}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }
  @media (max-width:400px){
    .modal{padding:34px 22px 26px;border-radius:24px}
    .card{padding:20px 18px 18px}
    .notify-banner{padding:12px 14px;gap:10px;border-radius:20px}
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>

<div class="wrap">
  <header class="hero">
    <span class="eyebrow">Актуально</span>
    <h1>Промокоды</h1>
    <p class="sub">Свежие коды от наших каналов. Обновляются в реальном времени.</p>
    <div class="counter">
      <span class="dot" id="statusDot"></span>
      <span id="countText">Загрузка…</span>
    </div>
    <div class="notify-banner" id="notifyBanner">
      <div class="bell" id="notifyBell">🔔</div>
      <div class="txt" id="notifyText">
        <b>Включи уведомления</b>
        <span>Узнавай о новых промокодах первым</span>
      </div>
      <button id="notifyBtn">Включить</button>
    </div>
  </header>

  <section class="section">
    <div class="grid" id="grid"></div>
  </section>

  <footer>Данные обновляются автоматически</footer>
</div>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="close" id="closeBtn" aria-label="Закрыть">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

const $ = id => document.getElementById(id);
const overlay = $('overlay'), modalBody = $('modalBody'), closeBtn = $('closeBtn');
const grid = $('grid'), countText = $('countText'), statusDot = $('statusDot');
const toast = $('toast');
const notifyBanner = $('notifyBanner'), notifyBtn = $('notifyBtn');
const notifyText = $('notifyText'), notifyBell = $('notifyBell');

let lastFocused = null, currentPromo = null, lastIds = [];
const freshUntil = new Map();

let lastDragAt = 0;

// ---------- УВЕДОМЛЕНИЯ ----------
function updateNotifyBanner(){
  if (!('Notification' in window)){ notifyBanner.classList.remove('show'); return; }
  const perm = Notification.permission;
  if (perm === 'granted'){
    notifyBanner.classList.add('show','ok'); notifyBanner.classList.remove('blocked');
    notifyBell.textContent = '🔔';
    notifyText.innerHTML = '<b>Уведомления включены</b><span>Мы сообщим о новых промокодах</span>';
    notifyBtn.textContent = 'Ок'; notifyBtn.onclick = () => notifyBanner.classList.remove('show'); return;
  }
  if (perm === 'denied'){
    notifyBanner.classList.add('show','blocked'); notifyBanner.classList.remove('ok');
    notifyBell.textContent = '🔕';
    notifyText.innerHTML = '<b>Уведомления заблокированы</b><span>Разреши в настройках браузера</span>';
    notifyBtn.textContent = 'Скрыть'; notifyBtn.onclick = () => notifyBanner.classList.remove('show'); return;
  }
  notifyBanner.classList.add('show'); notifyBanner.classList.remove('ok','blocked');
  notifyBell.textContent = '🔔';
  notifyText.innerHTML = '<b>Включи уведомления</b><span>Узнавай о новых промокодах первым</span>';
  notifyBtn.textContent = 'Включить';
  notifyBtn.onclick = async () => {
    try { const p = await Notification.requestPermission(); updateNotifyBanner(); if (p === 'granted') showBrowserNotification({ title: 'Уведомления включены 🎉', body: 'Теперь ты узнаешь о новых промокодах первым!' }); } catch {}
  };
}
function showBrowserNotification({ title, body, tag }){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const n = new Notification(title, { body, tag: tag || 'promo', silent: false });
    n.onclick = () => { window.focus(); n.close(); };
    setTimeout(() => { try { n.close(); } catch {} }, 12000);
  } catch {}
}

// ---------- API ----------
async function api(path, opts){
  const ctrl = new AbortController();
  const timeout = setTimeout(() => ctrl.abort(), 30000);
  try {
    const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, cache: 'no-store', signal: ctrl.signal, ...opts });
    clearTimeout(timeout);
    let data = null; try { data = await res.json(); } catch {}
    return { ok: res.ok, status: res.status, data };
  } catch (e) { clearTimeout(timeout); return { ok: false, status: 0, data: null }; }
}

function showToast(text){
  toast.textContent = text; toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2500);
}

function timeAgo(iso){
  const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (diff < 10) return 'только что';
  if (diff < 60)  return `${diff} сек назад`;
  if (diff < 3600) return `${Math.floor(diff/60)} мин назад`;
  if (diff < 86400) return `${Math.floor(diff/3600)} ч назад`;
  if (diff < 604800) return `${Math.floor(diff/86400)} дн назад`;
  return new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
}

function gameEmoji(name){
  const list = ['🎮','🔪','⚔️','🎯','🏆','💎','🔥','⚡','🎲','🚀','👾','🎪'];
  let h = 0; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return list[Math.abs(h) % list.length];
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

async function loadPromos({ silent } = {}){
  try {
    const { ok, data } = await api('/api/promos');
    if (!ok || !data) throw new Error();
    statusDot.classList.remove('off');
    renderGrid(data.promos || [], data.game || 'Standknife', silent);
  } catch {
    if (!silent){
      grid.innerHTML = '<div class="empty">Не удалось загрузить промокоды.</div>';
      countText.textContent = 'Ошибка соединения';
      statusDot.classList.add('off');
    }
  }
}

function plural(n, one, two, many){
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return two;
  return many;
}

function renderGrid(promos, game, silent){
  const ids = promos.map(p => p.id);
  const isFirstLoad = lastIds.length === 0;
  const added = ids.filter(id => !lastIds.includes(id));
  if (silent && added.length === 0 && !lastIds.filter(id => !ids.includes(id)).length && grid.children.length === promos.length) return;

  const now = Date.now();
  for (const id of added) freshUntil.set(id, now + 8000);
  lastIds = ids;

  if (!promos.length){
    grid.innerHTML = '<div class="empty">Пока нет ни одного промокода.<br>Заходи позже 👀</div>';
    countText.textContent = 'Ожидаем первый промокод';
    return;
  }

  countText.textContent = `Доступно ${promos.length} ${plural(promos.length, 'промокод', 'промокода', 'промокодов')}`;

  grid.innerHTML = promos.map((p, i) => {
    const fresh = (freshUntil.get(p.id) || 0) > now;
    return `
      <article class="card ${fresh ? 'fresh' : ''}" style="animation-delay:${Math.min(i*50,400)}ms" data-id="${esc(p.id)}">
        <div class="card-top">
          <div class="game-icon">${gameEmoji(p.game)}</div>
          <span class="badge ${fresh ? 'new' : ''}">${fresh ? '🆕 Новый' : esc(p.game)}</span>
        </div>
        <h3 class="game-name">Промокод на ${esc(p.game)}</h3>
        <div class="meta">
          <span class="meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            <span class="channel">${esc(p.channel)}</span>
          </span>
          <span class="meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span data-added="${esc(p.addedAt)}">${timeAgo(p.addedAt)}</span>
          </span>
        </div>
        <button class="reveal" data-id="${esc(p.id)}">Получить промокод</button>
      </article>`;
  }).join('');

  grid.querySelectorAll('.reveal').forEach(btn => {
    btn.addEventListener('click', () => {
      const promo = promos.find(x => x.id === btn.dataset.id);
      if (promo) openForPromo(promo);
    });
  });

  if (!isFirstLoad && added.length > 0){
    showToast('🔔 Новый промокод на сайте!');
    const newPs = promos.filter(p => added.includes(p.id));
    if (newPs.length === 1)
      showBrowserNotification({ title: '🔔 Новый промокод!', body: `${newPs[0].game} — от ${newPs[0].channel}`, tag: 'promo-'+newPs[0].id });
    else if (newPs.length > 1)
      showBrowserNotification({ title: `🔔 ${newPs.length} новых промокода!`, body: newPs.slice(0,3).map(p => `${p.game} — ${p.channel}`).join('\n'), tag: 'promo-multi-'+Date.now() });
  }
}

setInterval(() => {
  document.querySelectorAll('[data-added]').forEach(el => { el.textContent = timeAgo(el.dataset.added); });
}, 30_000);

function openOverlay(){
  lastFocused = document.activeElement;
  overlay.classList.add('show'); overlay.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closeOverlay(){
  overlay.classList.remove('show'); overlay.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  if (lastFocused && lastFocused.focus) lastFocused.focus();
}
closeBtn.addEventListener('click', closeOverlay);

overlay.addEventListener('click', e => {
  if (e.target !== overlay) return;
  if (Date.now() - lastDragAt < 800) return;
  closeOverlay();
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.classList.contains('show')) closeOverlay(); });

function renderLoading(){
  modalBody.innerHTML = '<div class="spinner"></div><h2 class="m-title" id="modalTitle">Секунду…</h2><p class="m-sub">Готовимся</p>';
}
function renderError(title, text, retry){
  modalBody.innerHTML = `<h2 class="m-title" id="modalTitle">${esc(title)}</h2><p class="m-sub">${esc(text)}</p>${retry ? '<button class="btn" id="retryBtn">Попробовать снова</button>' : ''}`;
  if (retry) $('retryBtn').addEventListener('click', () => openForPromo(currentPromo));
}

async function openForPromo(promo){
  currentPromo = promo;
  renderLoading();
  openOverlay();
  renderSlider();
}

// ===== СЛАЙДЕР-КАПЧА v3 =====
function renderSlider(){
  modalBody.innerHTML = `
    <h2 class="m-title" id="modalTitle">Проверка</h2>
    <p class="m-sub">Перетащи движку вправо до конца, чтобы получить промокод</p>
    <div class="slider-wrap" id="sliderWrap">
      <div class="slider-track" id="sliderTrack">
        <div class="slider-fill" id="sliderFill"></div>
        <div class="slider-hint" id="sliderHint">
          <span class="slider-arrows">›››</span>
          <span>Потяни</span>
        </div>
        <div class="slider-thumb" id="sliderThumb">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="err" id="sliderErr"></div>
  `;

  const track = $('sliderTrack');
  const thumb = $('sliderThumb');
  const fill  = $('sliderFill');
  const hint  = $('sliderHint');
  const errEl = $('sliderErr');

  const THUMB_W  = 44;
  const THRESHOLD = 0.80;   // мягче: достаточно 80% пути

  let dragging = false;
  let startX = 0, startLeft = 0;
  let startTime = 0;
  let positions = [];
  let isDone = false;

  function getTrackWidth(){ return track.getBoundingClientRect().width; }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function setLeft(px){
    thumb.style.left = px + 'px';
    fill.style.width  = (px + THUMB_W) + 'px';
    if (px > 8) hint.classList.add('hidden');
    else hint.classList.remove('hidden');
  }

  setLeft(0);

  function addPoint(x, t){
    positions.push({ x, t: t || Date.now() });
    if (positions.length > 400) positions = positions.slice(-200);
  }

  function onStart(clientX){
    if (isDone) return;
    dragging = true;
    startX = clientX;
    startLeft = parseFloat(thumb.style.left) || 0;
    startTime = Date.now();
    positions = [{ x: clientX, t: startTime }];
    errEl.textContent = '';
    lastDragAt = Date.now();
  }

  function updatePos(clientX){
    const trackW = getTrackWidth();
    const maxLeft = trackW - THUMB_W;
    const newLeft = clamp(startLeft + (clientX - startX), 0, maxLeft);
    setLeft(newLeft);
  }

  function calcStats(){
    let maxJump = 0;
    let totalDist = 0;
    for (let i = 1; i < positions.length; i++){
      const dx = Math.abs(positions[i].x - positions[i-1].x);
      if (dx > maxJump) maxJump = dx;
      totalDist += dx;
    }
    return { maxJump, totalDist };
  }

  function onEnd(finalX){
    if (!dragging || isDone) return;
    dragging = false;
    lastDragAt = Date.now();

    // Финальная точка — обязательно!
    if (typeof finalX === 'number') addPoint(finalX, Date.now());

    const trackW = getTrackWidth();
    const ratio  = parseFloat(thumb.style.left) / (trackW - THUMB_W);
    const duration = Date.now() - startTime;

    if (ratio < THRESHOLD){
      thumb.classList.add('released');
      setLeft(0);
      setTimeout(() => thumb.classList.remove('released'), 350);
      return;
    }

    const eventCount = positions.length;
    let variance = 0;
    if (positions.length >= 4){
      const deltas = [];
      for (let i = 1; i < positions.length; i++){
        const dt = positions[i].t - positions[i-1].t;
        const dx = Math.abs(positions[i].x - positions[i-1].x);
        if (dt > 0) deltas.push(dx / dt);
      }
      if (deltas.length >= 3){
        const mean = deltas.reduce((s,v) => s+v, 0) / deltas.length;
        const sq   = deltas.reduce((s,v) => s + (v-mean)**2, 0) / deltas.length;
        const std  = Math.sqrt(sq);
        variance = mean > 0 ? std / mean : 0;
      }
    }

    isDone = true;
    thumb.classList.add('done');
    fill.classList.add('done');
    hint.classList.add('hidden');
    thumb.innerHTML = '<svg fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

    const { maxJump, totalDist } = calcStats();
    verifyAndReveal({ duration, eventCount, variance, maxJump, totalDist });
  }

  // --- POINTER EVENTS + COALESCED ---
  thumb.addEventListener('pointerdown', (e) => {
    if (isDone) return;
    e.preventDefault();
    e.stopPropagation();
    try { thumb.setPointerCapture(e.pointerId); } catch {}
    onStart(e.clientX);
  });

  thumb.addEventListener('pointermove', (e) => {
    if (!dragging || isDone) return;
    e.preventDefault();

    // getCoalescedEvents — все промежуточные точки, которые браузер "схлопнул" в одно событие
    let coalesced = [];
    try {
      if (typeof e.getCoalescedEvents === 'function') {
        coalesced = e.getCoalescedEvents() || [];
      }
    } catch {}

    if (coalesced.length > 0){
      for (const ev of coalesced){
        addPoint(ev.clientX, ev.timeStamp || Date.now());
      }
    } else {
      addPoint(e.clientX, e.timeStamp || Date.now());
    }

    updatePos(e.clientX);
    lastDragAt = Date.now();
  });

  thumb.addEventListener('pointerup', (e) => {
    if (!dragging) return;
    e.preventDefault();
    try { thumb.releasePointerCapture(e.pointerId); } catch {}
    // Обновить позицию по финальной точке, чтобы ratio был точным
    updatePos(e.clientX);
    onEnd(e.clientX);
  });

  thumb.addEventListener('pointercancel', (e) => {
    if (dragging) onEnd(e.clientX);
  });

  window.addEventListener('blur', () => { if (dragging) onEnd(); });

  async function verifyAndReveal({ duration, eventCount, variance, maxJump, totalDist }){
    const { ok: vOk, status: vSt, data: vData } = await api('/api/verify-slider', {
      method: 'POST',
      body: JSON.stringify({ duration, eventCount, variance, maxJump, totalDist })
    });

    if (!vOk){
      if (vSt === 429){ renderError('Слишком много попыток', 'Попробуй через немного', false); return; }
      renderError('Ошибка', 'Попробуй ещё раз', true); return;
    }

    const token = vData && vData.token;
    if (!token){ renderError('Ошибка', 'Попробуй ещё раз', true); return; }

    const { ok, status, data } = await api('/api/reveal', {
      method: 'POST',
      body: JSON.stringify({ token, promoId: currentPromo.id })
    });

    if (ok && data && data.code){ renderCode(data); return; }
    if (status === 404){ closeOverlay(); loadPromos(); return; }
    if (status === 429){ renderError('Слишком много попыток', 'Попробуй через немного', false); return; }
    renderError('Не получилось', 'Попробуй ещё раз', true);
  }
}

// ===== ПРОМОКОД НА CANVAS =====
function renderCode({ code, game, channel }){
  modalBody.innerHTML = `
    <svg class="success" viewBox="0 0 52 52" aria-hidden="true">
      <circle cx="26" cy="26" r="24"/>
      <path d="M14 27l8 8 16-16"/>
    </svg>
    <h2 class="m-title" id="modalTitle">Промокод для ${esc(game)}</h2>
    <p class="m-sub">Скопируй и активируй в игре${channel ? `<br>От канала <b>${esc(channel)}</b>` : ''}</p>
    <div class="code-canvas-wrap">
      <canvas id="codeCanvas" aria-label="Промокод"></canvas>
    </div>
    <button class="btn" id="copyBtn">Скопировать код</button>
  `;

  const canvas = $('codeCanvas');
  drawCode(canvas, code);

  const copyBtn = $('copyBtn');
  copyBtn.addEventListener('click', async () => {
    const ok = await copyText(code);
    copyBtn.textContent = ok ? 'Скопировано ✓' : 'Выдели вручную';
    if (ok) copyBtn.classList.add('copied');
    setTimeout(() => { copyBtn.textContent = 'Скопировать код'; copyBtn.classList.remove('copied'); }, 1900);
  });
}

function drawCode(canvas, code){
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const W = 360, H = 80;
  canvas.width  = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);

  ctx.clearRect(0, 0, W, H);
  const isDark = window.matchMedia('(prefers-color-scheme:dark)').matches;
  const fontSize = Math.min(30, Math.floor(W * 0.076));
  ctx.fillStyle = isDark ? '#60a5fa' : '#0071e3';
  ctx.font = `700 ${fontSize}px Arial,Helvetica,sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(code, W/2, H/2);

  ctx.strokeStyle = isDark ? 'rgba(96,165,250,.20)' : 'rgba(0,113,227,.16)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(16, H/2 - 5 + (Math.random()-0.5)*6);
  ctx.bezierCurveTo(W*0.3, H/2+(Math.random()-0.5)*14, W*0.7, H/2+(Math.random()-0.5)*14, W-16, H/2+5+(Math.random()-0.5)*6);
  ctx.stroke();
  ctx.stroke();
}

async function copyText(text){
  try { if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; } } catch {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch { return false; }
}

// ---------- SSE ----------
function connectSSE(){
  let es; try { es = new EventSource('/api/events'); } catch { return; }
  es.onmessage = e => {
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    if (['promo-added','promo-removed','user-updated'].includes(msg.type)) loadPromos({ silent: true });
  };
  es.onerror = () => {};
}

// ---------- СТАРТ ----------
updateNotifyBanner();
loadPromos();
connectSSE();
setInterval(() => loadPromos({ silent: true }), 5_000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadPromos({ silent: true }); });
</script>
